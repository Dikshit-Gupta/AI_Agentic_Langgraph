[project]
name = "agenticlanggraph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dikshit-Gupta", email = "dikshitgupta351@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.4.0",
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.24",
    "langsmith>=0.16.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agenticlanggraph = "agenticlanggraph:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
